[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveframe-guard"
version = "0.4.0"
description = "Local enforcement SDK and simulation environment for AI governance."
authors = [
    { name = "Shawn Wright", email = "swright@waveframelabs.org" }
]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ai governance", "policy enforcement", "execution control", "compliance", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

# 🔒 Proprietary license
license = { text = "Proprietary" }

dependencies = [
    "cricore",
    "cricore-proposal-normalizer",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["waveframe_guard*"]
exclude = ["cloud*", "benchmarks*", "docs*", "examples*", "tests*"]
