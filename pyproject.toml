[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveframe-guard"
version = "0.10.0"
description = "Execution-boundary SDK for allowing or blocking governed actions before they run."
authors = [
    { name = "Shawn Wright", email = "swright@waveframelabs.org" }
]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ai governance", "execution boundary", "policy enforcement", "compliance", "audit", "agent safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

dependencies = [
    "cricore",
    "cricore-proposal-normalizer",
    "requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["waveframe_guard*", "guard*"]
exclude = ["temp*", "benchmarks*", "docs*", "examples*", "tests*"]
