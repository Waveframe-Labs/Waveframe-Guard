[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waveframe-guard"
version = "0.16.0"
description = "Execution-boundary SDK for allowing or blocking governed actions before they run."
authors = [
    { name = "Shawn Wright", email = "swright@waveframelabs.org" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai governance", "execution boundary", "policy enforcement", "compliance", "audit", "agent safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

dependencies = [
    "cricore",
    "cricore-proposal-normalizer",
    "governance-ledger>=0.7.0,<0.8.0",
    "requests",
]

[project.scripts]
waveframe-guard-external-agent = "waveframe_guard.quickstarts.external_agent:main"

[project.optional-dependencies]
test = [
    "build",
    "cricore-contract-compiler==0.4.0",
    "pytest",
    'tomli>=2.0.0; python_version < "3.11"',
    "twine",
]
dev = [
    "build",
    "cricore-contract-compiler==0.4.0",
    "pytest",
    'tomli>=2.0.0; python_version < "3.11"',
    "twine",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["waveframe_guard*", "guard*"]
exclude = ["temp*", "benchmarks*", "docs*", "examples*", "tests*"]
