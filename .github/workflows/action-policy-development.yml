name: Action policy release and development acceptance

on:
  pull_request:
    branches: [main, feat/36-workspace-file-creation, feat/46-native-cloud-connection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Action policy / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CLOUD_TEST_ACCESS: ${{ secrets.CLOUD_TEST_READ_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: sdk-python
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact tested head
        run: python -c "import pathlib,subprocess; p=pathlib.Path('acceptance-output'); p.mkdir(exist_ok=True); (p/'guard-head.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))"
      - name: Install exact release client candidates
        run: python -m pip install -e ".[test]" -r .github/requirements/action-policy-release.txt --report acceptance-output/source-install.json
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Run default closed-gate suite
        run: python -m pytest -q --junitxml=acceptance-output/default.xml
      - name: Require every release source case
        run: python -c "from pathlib import Path; from tools.acceptance.release_catalog_package import summarize; summarize(Path('acceptance-output/default.xml'))"
      - name: Run opted-in full suite
        env:
          WAVEFRAME_GUARD_ACTION_POLICY_DEV: "1"
          WAVEFRAME_LEDGER_ACTION_POLICY_DEV: "1"
        run: python -m pytest -q --junitxml=acceptance-output/development.xml
      - name: Verify fresh distributions and installed-wheel creation
        run: python tools/acceptance/release_catalog_package.py --output acceptance-output/package
      - name: Fetch authorized private Cloud test dependency
        if: env.CLOUD_TEST_ACCESS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Waveframe-Labs/Waveframe-Cloud
          ref: 547291b525e2f1d05d92ed65b6058c4ca91588a8
          token: ${{ secrets.CLOUD_TEST_READ_TOKEN }}
          path: .cloud-test-source
          persist-credentials: false
      - name: Set up Cloud's independent server interpreter
        if: env.CLOUD_TEST_ACCESS == 'true'
        id: cloud-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Installed SDK against unchanged pinned Cloud server
        if: env.CLOUD_TEST_ACCESS == 'true'
        env:
          SDK_PYTHON: ${{ steps.sdk-python.outputs.python-path }}
          CLOUD_PYTHON: ${{ steps.cloud-python.outputs.python-path }}
        run: python -c "import os,subprocess; subprocess.run([os.environ['SDK_PYTHON'], 'tools/acceptance/native_cloud_package.py', '--wheel', 'acceptance-output/package/waveframe_guard-0.18.0-py3-none-any.whl', '--output', 'acceptance-output/connected', '--cloud-source', '.cloud-test-source', '--server-base-python', os.environ['CLOUD_PYTHON']], check=True)"
      - name: Record private test dependency availability
        if: env.CLOUD_TEST_ACCESS != 'true'
        run: python -c "from pathlib import Path; Path('acceptance-output/connected-ci-unavailable.txt').write_text('Connected CI requires read-only CLOUD_TEST_READ_TOKEN access to the pinned private Cloud test dependency. Run native_cloud_package.py in an authorized environment. This job does not claim real-server acceptance.\n')"
      - name: Retain exact-run acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: action-policy-${{ matrix.os }}-${{ matrix.python }}
          path: acceptance-output/
