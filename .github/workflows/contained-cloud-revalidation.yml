name: Contained Cloud revalidation

on:
  pull_request:
    branches: [spike/57-contained-cloud]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Published SDK and contained evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install existing published wheels without rebuilding packages
        run: >-
          python -m pip install --only-binary=:all:
          waveframe-guard==0.19.0 governance-ledger==0.9.0
          cricore-contract-compiler==0.5.0 pytest==9.0.3
      - name: Validate repository and retained evidence
        run: |
          python tools/validate_repository.py --diff-base 0d2376c971c1d9c8e7c15ee208bfeee1a6f8659e
          python examples/codex_contained/verify_revalidation.py --output docs/acceptance/codex-cloud-59/evidence
      - name: Run focused adapter and captured interaction checks
        run: >-
          python -m pytest -q -p no:cacheprovider
          examples/codex_contained/test_configuration.py
          examples/codex_contained/test_cloud_writer.py
          examples/codex_contained/test_evidence.py
          tests/test_codex_connection.py tests/test_codex_cloud_revalidation.py
